name: Build enginehost KiriKiri2 plugin

on:
  push:
    branches: ["plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restore upstream-published native dependencies
        run: |
          curl --fail --location --retry 5 --output thirdparty_port.tar.gz \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_port.tar.gz
          curl --fail --location --retry 5 --output thirdparty_build.tar.gz \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_build.tar.gz
          tar xzf thirdparty_port.tar.gz
          tar xzf thirdparty_build.tar.gz
      - name: Restore runtime assets
        run: |
          curl --fail --location --retry 5 --output upstream.apk \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/1.3.9_yuri/Kirikiroid2_yuri_1.3.9.apk
          7z x upstream.apk assets
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 11
      - name: Build plugin APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          sudo mkdir -p /build_android
          sudo chown "$USER" /build_android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Pack the unsigned bundle inputs
        if: startsWith(github.ref, 'refs/heads/plugin/')
        run: |
          set -euo pipefail
          apk="$(find build_android/outputs/apk/debug -name '*.apk' -print -quit)"
          test -f "$apk"
          mkdir -p build/unsigned/payload
          cp "$apk" build/unsigned/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/unsigned/payload
          cp enginehost/LICENSES.md build/unsigned/payload/LICENSES.md
          cp enginehost/bundle-metadata.json build/unsigned/bundle-metadata.json
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-kirikiri2-debug-apk
          path: ${{ github.workspace }}/build_android/outputs/apk/debug/*.apk
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/heads/plugin/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-kirikiri2-bundle-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build (Enginehost
    # docs/security/2026-09-24-ci-supply-chain.md). Signs exactly when the
    # build packed a bundle; publish and unstable skip with it.
    needs: android
    if: startsWith(github.ref, 'refs/heads/plugin/')
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      unsigned-artifact: enginehost-kirikiri2-bundle-unsigned
      bundle: dev.enginehost.kirikiri.v1.enginehost.tar.xz
      artifact-name: enginehost-kirikiri2-bundle
      channel: ${{ inputs.channel }}
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-kirikiri2-bundle
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-kirikiri2-bundle
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
