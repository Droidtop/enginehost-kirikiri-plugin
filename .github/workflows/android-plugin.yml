name: Build enginehost KiriKiri2 plugin

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""
permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Droidtop/enginehost
          ref: codex/engine-bundles
          path: enginehost-tooling
      - name: Restore upstream-published native dependencies
        run: |
          curl --fail --location --retry 5 --output thirdparty_port.tar.gz \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_port.tar.gz
          curl --fail --location --retry 5 --output thirdparty_build.tar.gz \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_build.tar.gz
          tar xzf thirdparty_port.tar.gz
          tar xzf thirdparty_build.tar.gz
      - name: Restore runtime assets
        run: |
          curl --fail --location --retry 5 --output upstream.apk \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/1.3.9_yuri/Kirikiroid2_yuri_1.3.9.apk
          7z x upstream.apk assets
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
      - name: Build plugin APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          sudo mkdir -p /build_android
          sudo chown "$USER" /build_android
          ./gradlew assembleDebug --no-daemon --stacktrace
      # The shipped library is stripped. A crash in it names only offsets, so
      # keep the unstripped library from the same build beside the release;
      # a tombstone plus this file gives the function and line.
      - name: Keep the unstripped native library for symbolizing crashes
        run: |
          mkdir -p build/symbols
          find /build_android project/android -path '*cmake*' -path '*/obj/arm64-v8a/*' -name '*.so' -exec cp {} build/symbols/ \; 2>/dev/null || true
          ls -la build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: native-symbols-${{ github.run_number }}
          path: build/symbols/
          if-no-files-found: warn
      - name: Build signed internal Enginehost bundle
        if: startsWith(github.ref, 'refs/heads/plugin/')
        env:
          ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}
        run: |
          test -n "$ENGINEHOST_SIGNING_KEY_PEM"
          apk="$(find build_android/outputs/apk/debug -name '*.apk' -print -quit)"
          test -f "$apk"
          mkdir -p build/payload build/output
          cp "$apk" build/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/payload
          # The wrapper APK is multidex. enginehost class-loads exactly the
          # dex files this metadata declares, so a hard-coded single-entry
          # list silently drops the rest of the wrapper at launch. Declare
          # what the payload actually contains, in load order.
          python3 - <<'DEXES'
          import json, pathlib, re
          payload = pathlib.Path('build/payload')
          def order(p):
              # classes.dex, classes2.dex ... classes10.dex is numeric order;
              # a lexical sort would put 10 ahead of 2.
              m = re.fullmatch(r'classes(\d*)\.dex', p.name)
              return int(m.group(1) or 1)
          dexes = sorted(payload.glob('classes*.dex'), key=order)
          assert dexes, 'no classes*.dex in the APK payload'
          meta = pathlib.Path('enginehost/bundle-metadata.json')
          data = json.loads(meta.read_text())
          data['dexFiles'] = [d.name for d in dexes]
          meta.write_text(json.dumps(data, indent=2) + '\n')
          print('dexFiles =', data['dexFiles'])
          DEXES
          cp enginehost/LICENSES.md build/payload/LICENSES.md
          printf '%s' "$ENGINEHOST_SIGNING_KEY_PEM" > build/signing-key.pem
          python3 enginehost-tooling/scripts/build-engine-bundle.py \
            --metadata enginehost/bundle-metadata.json --payload build/payload \
            --private-key build/signing-key.pem \
            --repository-key-document enginehost-public-key.json \
            --output build/output/dev.enginehost.kirikiri.v1.enginehost.tar.xz \
            --release-envelope build/output/enginehost-release.json \
            --public-key-document build/output/enginehost-public-key.json
          cmp enginehost-public-key.json build/output/enginehost-public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-kirikiri2-debug-apk
          path: |
            ${{ github.workspace }}/build_android/outputs/apk/debug/*.apk
            build/output/*
          if-no-files-found: error

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one.
    needs: android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish the signed bundle on the chosen channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # No artifact at all (a branch whose build makes no bundle) means no
          # release directory either; that is "nothing to publish", not an error.
          mkdir -p release
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          if [ -z "$bundle" ]; then
            echo "This branch's build produced no signed bundle; nothing to publish."
            exit 0
          fi
          id="$(basename "$bundle" .enginehost.tar.xz)"
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          test -f "$envelope"
          # The envelope names its channel; the app filters on it. The signed
          # manifest inside is untouched.
          python3 - "$envelope" "$CHANNEL" <<'PY'
          import json, sys
          path, channel = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["channel"] = channel
          json.dump(data, open(path, "w"), indent=2)
          PY
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          case "$CHANNEL" in
            stable) prerelease="" ;;
            testing) tag="$tag-testing"; prerelease="--prerelease" ;;
            unstable) tag="$tag-unstable"; prerelease="--prerelease" ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          notes="Signed Enginehost bundle \`$id\` on the **$CHANNEL** channel, built from \`${{ github.ref_name }}\` at \`${{ github.sha }}\` (build ${{ github.run_number }}). Install it through Enginehost rather than unpacking it by hand: the bundle is verified file by file at install time against the key pinned for this repository."
          if [ "$CHANNEL" = unstable ]; then
            # Rolling: the newest green build of the line is the whole release.
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --repo "${{ github.repository }}" --title "$id (unstable)" $prerelease --notes "$notes"
          elif gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$tag" --repo "${{ github.repository }}" --notes "$notes"
          else
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --repo "${{ github.repository }}" --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          fi

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it. Branches whose build makes no bundle publish nothing.
    needs: android
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish the signed bundle on the unstable channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: unstable
          REQUESTED_TAG: 
        run: |
          set -euo pipefail
          # No artifact at all (a branch whose build makes no bundle) means no
          # release directory either; that is "nothing to publish", not an error.
          mkdir -p release
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          if [ -z "$bundle" ]; then
            echo "This branch's build produced no signed bundle; nothing to publish."
            exit 0
          fi
          id="$(basename "$bundle" .enginehost.tar.xz)"
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          test -f "$envelope"
          # The envelope names its channel; the app filters on it. The signed
          # manifest inside is untouched.
          python3 - "$envelope" "$CHANNEL" <<'PY'
          import json, sys
          path, channel = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["channel"] = channel
          json.dump(data, open(path, "w"), indent=2)
          PY
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          case "$CHANNEL" in
            stable) prerelease="" ;;
            testing) tag="$tag-testing"; prerelease="--prerelease" ;;
            unstable) tag="$tag-unstable"; prerelease="--prerelease" ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          notes="Signed Enginehost bundle \`$id\` on the **$CHANNEL** channel, built from \`${{ github.ref_name }}\` at \`${{ github.sha }}\` (build ${{ github.run_number }}). Install it through Enginehost rather than unpacking it by hand: the bundle is verified file by file at install time against the key pinned for this repository."
          if [ "$CHANNEL" = unstable ]; then
            # Rolling: the newest green build of the line is the whole release.
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --repo "${{ github.repository }}" --title "$id (unstable)" $prerelease --notes "$notes"
          elif gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$tag" --repo "${{ github.repository }}" --notes "$notes"
          else
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --repo "${{ github.repository }}" --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          fi
