name: Sync yuri with upstream YuriSizuku/Kirikiroid2Yuri

# yuri exists purely as an always-current mirror of upstream
# YuriSizuku/Kirikiroid2Yuri. Real plugin work happens on plugin/<line> branches,
# which pull from yuri on their own deliberate schedule rather than
# being auto-merged here: rebasing a patched branch unattended risks a
# silent, wrong conflict resolution, so that step stays manual by design.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: yuri
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync yuri with upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/YuriSizuku/Kirikiroid2Yuri.git
          git fetch upstream yuri

          if git merge-base --is-ancestor upstream/yuri HEAD; then
            echo "yuri already contains upstream/yuri, nothing to do."
            exit 0
          fi

          # A plain merge, not --ff-only: this branch also carries our own
          # workflow files (and, on some plugin repos, small wrapper
          # commits upstream never has), so a byte-for-byte fast-forward
          # is not always possible even when there is no real conflict.
          # A genuine conflict still fails the job loudly, which is the
          # signal we want: someone committed engine changes to the mirror
          # branch and they belong on a plugin/* branch instead.
          git merge --no-edit upstream/yuri
          if git push origin yuri 2>/tmp/push.log; then
            exit 0
          fi
          cat /tmp/push.log >&2
          echo "PUSH_FAILED=true" >> "$GITHUB_ENV"

      - name: Open a follow-up issue if the push was rejected
        if: env.PUSH_FAILED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream sync: yuri merge could not be pushed"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json title -q ".[] | select(.title == \"$title\") | .title")
          if [ -n "$existing" ]; then
            echo "issue already open, not filing a duplicate"
            exit 0
          fi
          cat > /tmp/issue-body.md <<BODY
          The scheduled upstream-sync workflow merged
          upstream/yuri into yuri locally but could
          not push the result -- most likely upstream's own
          .github/workflows/** changed and the default GITHUB_TOKEN is not
          allowed to update workflow files (see run log). yuri on
          GitHub is untouched. Run: $RUN_URL

          Needs a PAT with the workflow scope (e.g. a repo secret such as
          SYNC_UPSTREAM_PAT) used as the checkout token, or a manual:
          \`\`\`
          git fetch upstream yuri
          git checkout yuri
          git merge upstream/yuri
          git push origin yuri
          \`\`\`
          BODY
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --body-file /tmp/issue-body.md
          exit 1
