# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Android SDK version that will be used as the compile project
PROP_COMPILE_SDK_VERSION=29
 
# Android SDK version that will be used as the earliest version of android this application can run on
PROP_MIN_SDK_VERSION=22

# Android SDK version that will be used as the latest version of android this application has been tested on
PROP_TARGET_SDK_VERSION=29


# The ABIs this bundle ships, one lib/<abi> each; Enginehost picks one at load
# time from Build.SUPPORTED_ABIS, first match wins, so the order here is the
# order it prefers them in. The rule for an enginehost plugin is arm64-v8a plus
# x86_64, and both are here. x86 stays beside them: it costs one more
# dependency tree and it is the only ABI of the three an x86 emulator or an
# older 32-bit x86 device can load. Each ABI needs its dependency tree built
# into thirdparty/build/arch_<platform> first -- script/cross_android.sh builds
# one, and the thirdparty job in .github/workflows/android-plugin.yml is where
# that happens for every ABI upstream does not publish.
PROP_APP_ABI=arm64-v8a:x86_64:x86

# android native code build type
# none, native code will never be compiled.
# cmake, native code will be compiled by CMakeLists.txt
# ndk-build, native code will be compiled by Android.mk
PROP_BUILD_TYPE=cmake

# uncomment it and fill in sign information for release mode
#RELEASE_STORE_FILE=file path of keystore
#RELEASE_STORE_PASSWORD=password of keystore
#RELEASE_KEY_ALIAS=alias of key
#RELEASE_KEY_PASSWORD=password of key
android.useAndroidX=True